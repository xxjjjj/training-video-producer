<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>培训视频预览</title>
<style>
html,body{margin:0;background:#eaf0f8;font-family:system-ui,sans-serif}canvas{display:block;width:min(100vw,1280px);height:auto;margin:auto}nav{max-width:1240px;margin:12px auto;display:flex;gap:12px;align-items:center}button,select{font:inherit;padding:8px 14px}#status{color:#42526a}
</style>
<canvas id="stage" width="1280" height="720"></canvas>
<nav><button id="play">播放预览</button><button id="record">录制 WebM</button><select id="scene"></select><span id="status">正在加载</span></nav>
<script>
const data=/*__VIDEO_DATA__*/null;
const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d');
const font='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
let current=0,audio=null,running=false,raf=0,layoutErrors=[];
window.videoDone=false;window.videoError='';window.videoTimeline=[];
const status=document.getElementById('status');

/* ===== 进度驱动的确定性动画：同一 progress 永远画出同一帧，布局校验可复算 ===== */
const clamp01=t=>Math.min(1,Math.max(0,t));
const seg=(p,a,b)=>clamp01((p-a)/(b-a));
const outCubic=t=>1-Math.pow(1-t,3);
const outQuint=t=>1-Math.pow(1-t,5);
const outBack=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};

function card(x,y,w,h,opt){
 const o=Object.assign({fill:'#fff',stroke:'#dbe4f0',alpha:1,r:14,shadow:true,lw:1.5},opt||{});
 ctx.save();ctx.globalAlpha*=Math.max(0,Math.min(1,o.alpha));
 if(o.shadow){ctx.shadowColor='rgba(16,24,40,.13)';ctx.shadowBlur=16;ctx.shadowOffsetY=6;}
 ctx.beginPath();ctx.roundRect(x,y,w,h,o.r);ctx.fillStyle=o.fill;ctx.fill();
 ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
 if(o.stroke){ctx.strokeStyle=o.stroke;ctx.lineWidth=o.lw;ctx.stroke();}
 ctx.restore();
}
function lines(value,maxWidth,size,weight=600){
 ctx.font=`${weight} ${size}px ${font}`;const output=[];let line='';
 for(const ch of String(value)){if(ch==='\n'){output.push(line);line='';continue;}if(ctx.measureText(line+ch).width>maxWidth&&line){output.push(line);line=ch;}else line+=ch;}
 if(line)output.push(line);return output;
}
/* 溢出检测与 v1 完全一致：无论透明度多低都先量后画 */
function text(value,x,y,w,h,size=24,color='#172033',weight=600,alpha=1){
 const rows=lines(value,w,size,weight);const lineHeight=size*1.4;
 if(rows.length*lineHeight>h+1)layoutErrors.push(`${data.scenes[current].id}: ${String(value).slice(0,18)}`);
 const a=Math.max(0,Math.min(1,alpha));if(a<=0.012)return;
 ctx.save();ctx.globalAlpha*=a;ctx.fillStyle=color;ctx.textBaseline='top';rows.forEach((line,i)=>ctx.fillText(line,x,y+i*lineHeight));ctx.restore();
}
const images={};
function loadImages(){
 const list=data.scenes.filter(s=>s.viewer&&s.viewer.image);
 return Promise.all(list.map(s=>new Promise(res=>{const im=new Image();im.onload=()=>res();im.onerror=()=>res();im.src=s.viewer.image;images[s.viewer.image]=im;})));
}
function drawImageFit(img,x,y,w,h,alpha){
 const ir=img.width/img.height,r=w/h;let dw,dh;
 if(ir>r){dw=w;dh=w/ir;}else{dh=h;dw=h*ir;}
 const dx=x+(w-dw)/2,dy=y+(h-dh)/2;
 ctx.save();ctx.globalAlpha*=alpha;
 ctx.beginPath();ctx.roundRect(dx,dy,dw,dh,10);ctx.clip();
 ctx.drawImage(img,dx,dy,dw,dh);
 ctx.restore();
 ctx.save();ctx.globalAlpha*=alpha;ctx.beginPath();ctx.roundRect(dx,dy,dw,dh,10);
 ctx.strokeStyle='#c7d4e8';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
}
function background(p){
 const g=ctx.createLinearGradient(0,0,0,720);g.addColorStop(0,'#f8fbff');g.addColorStop(1,'#e8eef9');
 ctx.fillStyle=g;ctx.fillRect(0,0,1280,720);
 const blobs=[[1080,130,200,'rgba(37,99,235,.07)'],[180,600,250,'rgba(14,165,233,.06)'],[650,370,320,'rgba(99,102,241,.045)']];
 for(const [bx,by,br,c] of blobs){ctx.beginPath();ctx.arc(bx+Math.sin(p*6.283)*10,by+Math.cos(p*6.283)*8,br,0,6.2832);ctx.fillStyle=c;ctx.fill();}
 ctx.fillStyle='rgba(16,24,40,.05)';
 for(let x=36;x<1280;x+=44)for(let y=36;y<720;y+=44)ctx.fillRect(x,y,2,2);
}
function header(s,p){
 const he=outQuint(seg(p,0,.16)),hy=-16*(1-he);
 ctx.save();ctx.globalAlpha*=Math.max(.15,he);ctx.translate(0,hy);
 ctx.font=`700 15px ${font}`;
 const tw=ctx.measureText(s.chapter).width;
 ctx.beginPath();ctx.roundRect(42,26,tw+32,30,15);ctx.fillStyle='#2563eb';ctx.fill();
 ctx.fillStyle='#fff';ctx.textBaseline='top';ctx.fillText(s.chapter,58,33);
 text(s.title,42,70,1000,56,38,'#101828',800,he);
 text(s.viewer.headline,42,132,1196,45,21,'#667085',600,he);
 const lw=1196*outCubic(seg(p,0,.3));
 ctx.fillStyle='rgba(37,99,235,.18)';ctx.fillRect(42,178,1196,2);
 ctx.fillStyle='#2563eb';ctx.fillRect(42,178,lw,2);
 ctx.restore();
}
function checkpoint(v,p){
 const e=outCubic(seg(p,.5,.66));
 card(42,573+10*(1-e),1196,52,{fill:'#fff7ed',stroke:'#fed7aa',alpha:Math.max(.15,e),r:12,shadow:e>.1});
 text(v.checkpoint,60,586,1160,35,19,'#9a3412',600,Math.max(.15,e));
}
function caption(s,p){
 const time=p*s.duration;
 const c=s.captions.find(c=>time>=c.start&&time<c.end)||s.captions.at(-1);
 const rel=clamp01((time-c.start)/.55),e=outCubic(rel);
 card(42,641,1196,62,{fill:'#ffffff',stroke:'#d8e0ec',alpha:.25+.75*e,r:12,shadow:e>.1});
 text(c.text,64,653,1152,45,26,'#172033',600,Math.max(.06,e));
}
/* 全屏真实截图模式：宽图整体放入，长图（比例>1.35）纵向自动滚动 */
function drawShowcase(s,v,p){
 const img=v.image?images[v.image]:null;
 if(!img||!img.complete||!img.naturalWidth)return drawExtract(s,v,p);
 const e=outQuint(seg(p,.03,.16)),X=66,Y=186,W=1148,H=372;
 card(X-12,Y-12,W+24,H+24,{alpha:e});
 ctx.save();ctx.globalAlpha=e;
 const cx=X+W/2,cy=Y+H/2,sc=.96+.04*e;
 ctx.translate(cx,cy);ctx.scale(sc,sc);ctx.translate(-cx,-cy);
 ctx.beginPath();ctx.roundRect(X,Y,W,H,10);ctx.save();ctx.clip();
 const fullH=img.height*W/img.width;
 if(fullH<=H*1.35){
  ctx.drawImage(img,X+(W-W*H/fullH)/2,Y,W*H/fullH,H);
 }else{
  const cropH=img.width*H/W,pan=seg(p,.1,.9)*(img.height-cropH);
  ctx.drawImage(img,0,pan,img.width,cropH,X,Y,W,H);
  /* 右缘滚动指示条 */
  const tx=X+W-12,ty=Y+10,th=H-20;
  ctx.fillStyle='rgba(16,24,40,.18)';ctx.beginPath();ctx.roundRect(tx-3,ty,6,th,3);ctx.fill();
  const thumbH=Math.max(24,th*cropH/img.height);
  const thumbY=ty+(th-thumbH)*seg(p,.1,.9);
  ctx.fillStyle='#2563eb';ctx.beginPath();ctx.roundRect(tx-3,thumbY,6,thumbH,3);ctx.fill();
 }
 ctx.restore();ctx.restore();
 const ce=outCubic(seg(p,.14,.28));
 if(ce>0){
  ctx.save();ctx.globalAlpha=ce;
  ctx.font=`700 15px ${font}`;const tw=ctx.measureText(v.leftTitle).width;
  ctx.beginPath();ctx.roundRect(X+14,Y+14,Math.min(tw+26,W-28),28,14);
  ctx.fillStyle='rgba(16,24,40,.78)';ctx.fill();
  ctx.fillStyle='#fff';ctx.textBaseline='top';ctx.fillText(v.leftTitle,X+27,Y+20);ctx.restore();
 }
}
function drawExtract(s,v,p){
 const le=outCubic(seg(p,.04,.18));
 card(42,193,520,333,{alpha:le});
 const img=v.image?images[v.image]:null;
 if(img&&img.complete&&img.naturalWidth>0){
  drawImageFit(img,66,215,492,222,le);
  text(v.leftTitle,66,448,492,36,19,'#475467',700,le);
 }else{
  text(v.leftTitle,66,216,468,42,25,'#101828',700,le);
  text(v.inputText,66,278,468,220,24,'#344054',600,le);
 }
 const re=outCubic(seg(p,.1,.24));
 card(686,193,552,333,{alpha:re});
 text(v.rightTitle,710,216,504,42,25,'#101828',700,re);
 const aE=outCubic(seg(p,.22,.36));
 if(aE>0){
  ctx.save();ctx.globalAlpha*=aE;
  ctx.strokeStyle='#2563eb';ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(566,346);ctx.lineTo(566+44*aE,346);ctx.stroke();
  ctx.fillStyle='#2563eb';ctx.beginPath();ctx.moveTo(612,335);ctx.lineTo(628,346);ctx.lineTo(612,357);ctx.closePath();ctx.fill();
  const pulse=.5+.5*outCubic(seg(p,.3,.45));
  ctx.globalAlpha*=pulse;ctx.beginPath();ctx.arc(638,346,4,0,6.2832);ctx.fill();
  ctx.restore();
 }
 const n=v.items.length;
 v.items.forEach((row,i)=>{
  const st=.14+i*(0.58/n),e=outCubic(seg(p,st,st+.13));
  const y=273+i*42;
  ctx.save();ctx.globalAlpha=Math.max(.1,e*.9);
  ctx.beginPath();ctx.roundRect(710,y,504,36,8);
  ctx.fillStyle='#f8fafc';ctx.fill();ctx.strokeStyle='#e5e7eb';ctx.lineWidth=1;ctx.stroke();
  ctx.restore();
  if(e>0){
   ctx.save();ctx.globalAlpha=e;
   ctx.beginPath();ctx.roundRect(710,y,504,36,8);ctx.fillStyle='#eff6ff';ctx.fill();
   ctx.strokeStyle='#bfdbfe';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
  }
  text(row,724,y+4,476,32,20,'#1d4ed8',600,e);
 });
}
function drawPipeline(s,v,p){
 const n=v.items.length,w=(1196-(n-1)*14)/n;
 v.items.forEach((item,i)=>{
  const st=.06+i*(0.5/n),e=outBack(seg(p,st,st+.14)),ea=Math.min(1,Math.max(e,0));
  const reached=p>(st+.1);
  const x=42+i*(w+14),y=220+14*(1-ea);
  card(x,y,w,188,{fill:reached?'#eff6ff':'#fff',stroke:reached?'#93c5fd':'#dbe4f0',alpha:Math.max(.12,ea)});
  text(`STEP ${i+1}`,x+16,244,w-32,28,17,'#2563eb',700,Math.max(.12,ea));
  text(item,x+16,292,w-32,104,23,'#344054',600,Math.max(.12,ea));
  if(i<n-1&&ea>.6){
   ctx.save();ctx.globalAlpha=(ea-.6)/.4*.9;
   ctx.fillStyle='#93c5fd';ctx.beginPath();ctx.arc(x+w+7,314,4,0,6.2832);ctx.fill();ctx.restore();
  }
 });
 const bp=outCubic(seg(p,.1,.9));
 ctx.fillStyle='#cbdcf9';ctx.fillRect(66,446,1148,5);
 ctx.save();if(bp>0){ctx.shadowColor='rgba(37,99,235,.45)';ctx.shadowBlur=8;}
 ctx.fillStyle='#2563eb';ctx.fillRect(66,446,Math.max(0,1148*bp),5);ctx.restore();
 const rE=outCubic(seg(p,.72,.9));
 text(v.result,66,477+8*(1-rE),1148,64,23,'#1d4ed8',700,Math.max(.08,rE));
}
function drawBoundary(s,v,p){
 const n=v.items.length,columns=2,w=586;
 v.items.forEach((item,i)=>{
  const st=.05+i*(0.55/n),e=outCubic(seg(p,st,st+.14));
  const x=42+(i%columns)*610,y=204+Math.floor(i/columns)*102+10*(1-e);
  card(x,y,w,88,{fill:'#fff5f5',stroke:'#fecaca',alpha:Math.max(.12,e),r:12});
  const ie=outBack(seg(p,st+.05,st+.2)),is=Math.max(0,Math.min(ie,1.15));
  ctx.save();ctx.globalAlpha=Math.max(.12,e);ctx.translate(x+35,y+44);ctx.scale(is,is);
  ctx.fillStyle='#b91c1c';ctx.font=`800 30px ${font}`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('!',0,1);ctx.restore();ctx.textAlign='left';
  text(item,x+60,y+25,w-80,55,24,'#991b1b',600,Math.max(.12,e));
 });
 const rE=outCubic(seg(p,.68,.84));
 text(v.result,66,524,1148,40,22,'#9a3412',700,Math.max(.08,rE));
}
function frame(index,progress){
 current=index;const s=data.scenes[index],v=s.viewer,p=clamp01(progress);
 background(p);
 header(s,p);
 if(v.imageFullscreen){drawShowcase(s,v,p);}
 else if(s.visualType==='extract')drawExtract(s,v,p);
 else if(s.visualType==='pipeline')drawPipeline(s,v,p);
 else drawBoundary(s,v,p);
 checkpoint(v,p);
 caption(s,p);
 ctx.save();ctx.globalAlpha=.45;ctx.fillStyle='#667085';ctx.font=`500 13px ${font}`;ctx.textBaseline='top';
 ctx.fillText('WorkBuddy · 工作 AI 改善案例',42,706);
 ctx.textAlign='right';ctx.fillText(`${index+1} / ${data.scenes.length}`,1238,706);ctx.restore();ctx.textAlign='left';
}
window.showFrame=frame;
window.checkLayout=()=>{
 layoutErrors=[];
 for(let i=0;i<data.scenes.length;i++){
  const scene=data.scenes[i];for(const c of scene.captions)frame(i,(c.start+.01)/scene.duration);
  frame(i,.99);
 }
 const errors=[...new Set(layoutErrors)];frame(0,0);return {errors,captionCoverage:data.scenes.map(s=>({id:s.id,characters:s.captions.reduce((n,c)=>n+Array.from(c.text).length,0)}))};
};
function tick(){if(!running)return;frame(current,audio?audio.currentTime/data.scenes[current].duration:0);raf=requestAnimationFrame(tick);}
const audios=data.scenes.map(s=>{const a=new Audio(s.audioData);a.preload='auto';return a;});
function ready(a){return new Promise((resolve,reject)=>{
 if(a.readyState>=3)return resolve();
 const timer=setTimeout(()=>{cleanup();reject(new Error('音频加载超时'));},20000);
 const cleanup=()=>{clearTimeout(timer);a.removeEventListener('canplaythrough',done);a.removeEventListener('error',fail);};
 const done=()=>{cleanup();resolve();},fail=()=>{cleanup();reject(new Error('音频加载失败'));};
 a.addEventListener('canplaythrough',done);a.addEventListener('error',fail);a.load();
});}
window.startVideo=async(record=false)=>{
 if(running)return;running=true;window.videoDone=false;window.videoError='';window.videoTimeline=[];
 document.querySelectorAll('button,select').forEach(e=>e.disabled=true);
 let ac,recorder,stream,recordStart=0;
 try{
  await document.fonts.ready;await Promise.all(audios.map(ready));
  ac=new AudioContext();await ac.resume();
  const destination=ac.createMediaStreamDestination();
  if(record){
   const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus'].find(x=>MediaRecorder.isTypeSupported(x));
   if(!mime)throw new Error('浏览器不支持 WebM 录制');
   stream=canvas.captureStream(30);stream.addTrack(destination.stream.getAudioTracks()[0]);
   recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:4500000});
   const chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
   recorder.onerror=e=>{window.videoError=e.error?.message||'录制失败';};
   recorder.onstop=()=>{
    if(window.videoError)return;
    const url=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));const a=document.createElement('a');a.href=url;a.download='recording.webm';a.click();
    setTimeout(()=>URL.revokeObjectURL(url),30000);
   };
   frame(0,0);recorder.start(1000);
  }
  recordStart=ac.currentTime;raf=requestAnimationFrame(tick);
  for(let i=0;i<data.scenes.length;i++){
   current=i;audio=audios[i];audio.currentTime=0;
   const source=ac.createMediaElementSource(audio);source.connect(destination);source.connect(ac.destination);
   const start=ac.currentTime-recordStart;
   await new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>done(new Error('音频播放超时')),data.scenes[i].duration*1000+15000);
    const ended=()=>done(),failed=()=>done(new Error('音频播放失败'));
    function done(error){clearTimeout(timer);audio.removeEventListener('ended',ended);audio.removeEventListener('error',failed);error?reject(error):resolve();}
    audio.addEventListener('ended',ended,{once:true});audio.addEventListener('error',failed,{once:true});audio.play().catch(done);
   });
   window.videoTimeline.push({id:data.scenes[i].id,start,end:ac.currentTime-recordStart});source.disconnect();
  }
  frame(data.scenes.length-1,.999);status.textContent=record?'录制完成':'播放完成';
 }catch(e){window.videoError=String(e);status.textContent=String(e);}
 finally{
  running=false;cancelAnimationFrame(raf);if(audio)audio.pause();
  if(recorder&&recorder.state!=='inactive'){await new Promise(resolve=>{recorder.addEventListener('stop',resolve,{once:true});recorder.stop();});}
  stream?.getTracks().forEach(t=>t.stop());await ac?.close();
  // Audio nodes cannot be reused with a new AudioContext. Create fresh elements for replay.
  for(let i=0;i<audios.length;i++){audios[i]=new Audio(data.scenes[i].audioData);audios[i].preload='auto';}
  document.querySelectorAll('button,select').forEach(e=>e.disabled=false);window.videoDone=true;
 }
};
document.getElementById('play').onclick=()=>window.startVideo(false);
document.getElementById('record').onclick=()=>window.startVideo(true);
const select=document.getElementById('scene');data.scenes.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${s.id} ${s.title}`;select.append(o);});select.onchange=()=>frame(Number(select.value),.75);
Promise.all([document.fonts.ready,loadImages()]).then(()=>{frame(0,0);window.videoReady=true;status.textContent='可播放；字幕时间为按字数估算，需试听复核';});
</script></html>
